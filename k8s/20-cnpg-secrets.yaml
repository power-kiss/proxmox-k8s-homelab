# Доступы, нужные кластеру PostgreSQL.
#
# ⚠️ ЗАГЛУШКИ. Поменяй значения перед применением.
#    В настоящем проекте это приходит из Vault через External Secrets Operator —
#    в git не должно попадать ничего из этого файла с реальными значениями.
#
# Предварительно создай в MinIO бакет и сервисного пользователя:
#   mc alias set homelab http://192.168.10.240:9000 minioadmin <ROOT_PASSWORD>
#   mc mb homelab/pg-backups
#   mc admin user add homelab pgbackup <SECRET_KEY>
#   mc admin policy attach homelab readwrite --user pgbackup
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3-creds
  namespace: db
type: Opaque
stringData:
  ACCESS_KEY_ID: "pgbackup"
  ACCESS_SECRET_KEY: "ЗАМЕНИ_МЕНЯ"
---
# Учётка приложения внутри PostgreSQL. CNPG создаст пользователя с этим паролем.
apiVersion: v1
kind: Secret
metadata:
  name: app-db-creds
  namespace: db
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: "ЗАМЕНИ_МЕНЯ_тоже"

# Статические локальные PV под MinIO: 3 ноды × 2 диска = 6 томов.
# Каждый том — отдельный физический SSD, смонтированный Ansible
# в /mnt/minio/disk1 (SSD2) и /mnt/minio/disk2 (SSD3).
#
# ПОЧЕМУ ЛОКАЛЬНЫЕ, А НЕ LONGHORN/CEPH:
# MinIO сам обеспечивает избыточность через erasure coding. Положив его на
# реплицируемое хранилище, получишь репликацию поверх репликации: расход диска
# кратно вырастет, каждая запись пойдёт лишний раз по сети, надёжность не изменится.
# Реплицируемое хранилище нужно тем нагрузкам, у которых своей репликации НЕТ.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: minio-local
provisioner: kubernetes.io/no-provisioner
# WaitForFirstConsumer — критично для local-томов: связывание PVC с PV
# откладывается до момента, когда планировщик выберет ноду для пода.
# С Immediate PVC привязался бы к случайному тому, и под мог бы не поместиться
# на нужную ноду — вечный Pending. Это частый вопрос на собеседовании.
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-k3s-1-disk1
spec:
  capacity: { storage: 33Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  local: { path: /mnt/minio/disk1 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [k3s-1] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-k3s-1-disk2
spec:
  capacity: { storage: 33Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  local: { path: /mnt/minio/disk2 }
  nodeAffinity:
